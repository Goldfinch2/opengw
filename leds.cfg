# OpenGW: its lamp colors and its control guide, for a cabinet with
# LED-lit controls (the cabinet's own leds.cfg wins where it has lines for
# opengw). See the VectorPie SDK's docs/07-packages.md.

opengw/color_map[p1_joystick1] #00C0FF
opengw/color_map[p2_joystick1] #FF8000
opengw/color_map[p1_button1]   #FF0000

opengw/voice_map[p1_joystick1] move
opengw/voice_map[p2_joystick1] aim
opengw/voice_map[p1_button1]   bomb
