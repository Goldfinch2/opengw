; OpenGW for VectorPie: the package manifest (see the SDK's game package docs)
id           = opengw
name         = Geometry Wars
manufacturer = Other
executable   = opengw
version      = 1.0.0
sdk          = 0.1
author       = Peter Hirschberg, VectorPie port
description  = Twin-stick shooter on a warping grid (OpenGW)
marquee      = marquee.png
hiscores     = yes

; The game's settings (formerly opengw.cfg): these for every output; [sdl]
; (a window), [dvg] (the USB-DVG) and [beamforge] (BeamForge, else [dvg]'s)
; override them.
; Controls come from advmame.rc: move on the p1 stick, aim on the p2 stick,
; button 1 drops a bomb.
credits_per_game   = true

[sdl]
grid_smoothing     = false
particle_smoothing = false
enemy_smoothing    = false
player_smoothing   = false
star_smoothing     = true
attractors         = 50
particles          = 3000
grid_passes        = 4
grid_spacing       = 4
sort_vectors       = false

[dvg]                              ; the USB-DVG (and the board's game settings)
frame_hz           = 40            ; frames a second
sort_vectors       = true
attractors         = 50
particles          = 100
grid_passes        = 4
grid_spacing       = 10
[beamforge]                        ; BeamForge (the [dvg] settings it does not set)
frame_hz           = 60
sort_vectors       = false
attractors         = 50
particles          = 100
grid_passes        = 4
grid_spacing       = 10
