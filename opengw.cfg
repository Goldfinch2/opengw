# OpenGW Settings
# Lines starting with # are comments
# Use [sdl] and [dvg] sections for build-specific settings

# Paths
marquee /usr/local/share/advance/artwork/marquees
advmamerc /home/pi/.advance/advmame.rc
sounds /usr/local/share/advance/opengw_dir/sounds
save /usr/local/share/advance/opengw_dir

# Gameplay
credits_per_game true

[sdl]
target_fps 60
enable_glow false
grid_smoothing false
particle_smoothing false
enemy_smoothing false
player_smoothing false
star_smoothing true
attractors 50
particles 3000
grid_passes 4
grid_spacing 4

[dvg]
dvg_refresh_rate 40
sort_vectors true
attractors 50
particles 100
grid_passes 4
grid_spacing 10
